name: Send Newsletter on New Article

on:
  push:
    branches:
      - master
    paths:
      - '_posts/*.md'
      - '_statements/*.md'

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get the new content (article or statement)
        id: content
        run: |
          CHANGED_POSTS=$(git diff --name-only HEAD~1 HEAD -- _posts/*.md || echo "")
          CHANGED_STATEMENTS=$(git diff --name-only HEAD~1 HEAD -- _statements/*.md || echo "")
          CHANGED_FILES="$CHANGED_POSTS"$'\n'"$CHANGED_STATEMENTS"
          NEW_FILE=$(echo "$CHANGED_FILES" | grep -v '^$' | head -1)

          if [ -z "$NEW_FILE" ]; then
            echo "No new content found"
            exit 0
          fi

          echo "file=$NEW_FILE" >> $GITHUB_OUTPUT
          echo "🔍 New content detected: $NEW_FILE"

      - name: Extract content data
        if: steps.content.outputs.file != ''
        id: data
        run: |
          FILE="${{ steps.content.outputs.file }}"

          # Extract and clean fields
          TITLE=$(sed -n '/^---$/,/^---$/p' "$FILE" | grep -E '^title:' | sed 's/title: //' | sed 's/^"//;s/"$//' | head -1 | tr '\n' ' ' | sed 's/"/\\"/g')
          CATEGORY=$(sed -n '/^---$/,/^---$/p' "$FILE" | grep -E '^category:' | sed 's/category: //' | head -1 | tr '\n' ' ' | sed 's/"/\\"/g')
          DATE=$(sed -n '/^---$/,/^---$/p' "$FILE" | grep -E '^date:' | sed 's/date: //' | head -1 | tr '\n' ' ' | sed 's/"/\\"/g')
          EXCERPT=$(sed -n '/^---$/,/^---$/p' "$FILE" | grep -E '^excerpt:' | sed 's/excerpt: //' | sed 's/^"//;s/"$//' | head -1 | tr '\n' ' ' | sed 's/"/\\"/g')

          FILENAME=$(basename "$FILE" .md)
          SLUG=$(echo "$FILENAME" | sed 's/^[0-9]*-[0-9]*-[0-9]*-//')

          # Determine content type and URL
          if echo "$FILE" | grep -q "_posts"; then
            CATEGORY="${CATEGORY:-Analysis}"
            URL="https://thenaijamarxists.org/analysis/$SLUG/"
          elif echo "$FILE" | grep -q "_statements"; then
            CATEGORY="${CATEGORY:-Statement}"
            URL="https://thenaijamarxists.org/statements/$SLUG/"
          fi

          SUBSTACK_URL="https://ngnmarxists.substack.com/p/$SLUG"

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "category=$CATEGORY" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "excerpt=$EXCERPT" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "substack_url=$SUBSTACK_URL" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

          echo "📝 Title: $TITLE"
          echo "📂 Category: $CATEGORY"
          echo "📅 Date: $DATE"
          echo "📄 Slug: $SLUG"

      - name: Trigger Supabase Edge Function
        if: steps.data.outputs.title != ''
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Build JSON payload safely
          TITLE="${{ steps.data.outputs.title }}"
          CATEGORY="${{ steps.data.outputs.category }}"
          DATE="${{ steps.data.outputs.date }}"
          EXCERPT="${{ steps.data.outputs.excerpt }}"
          URL="${{ steps.data.outputs.url }}"
          SUBSTACK_URL="${{ steps.data.outputs.substack_url }}"
          SLUG="${{ steps.data.outputs.slug }}"

          # Use printf and jq to safely construct JSON
          JSON_PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg category "$CATEGORY" \
            --arg date "$DATE" \
            --arg excerpt "$EXCERPT" \
            --arg url "$URL" \
            --arg substack_url "$SUBSTACK_URL" \
            --arg slug "$SLUG" \
            '{
              article: {
                title: $title,
                category: $category,
                date: $date,
                excerpt: $excerpt,
                url: $url,
                substack_url: $substack_url,
                slug: $slug
              }
            }')

          echo "📦 JSON Payload: $JSON_PAYLOAD"

          curl -X POST "https://pcpntpuujhrvbffgpixs.supabase.co/functions/v1/send-newsletter" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d "$JSON_PAYLOAD"

      - name: Log result
        if: always()
        run: |
          if [ "${{ steps.data.outputs.title }}" != "" ]; then
            echo "✅ Newsletter sent for: ${{ steps.data.outputs.title }}"
          else
            echo "⏭️ No new content detected, skipping newsletter"
          fi